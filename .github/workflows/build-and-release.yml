
name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-and-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and private submodules
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GRAPHDLC_REPO_TOKEN }}
          submodules: recursive
          fetch-depth: 0

      - name: Set package version
        id: version
        run: |
          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%-m)
          DAY=$(date -u +%-d)
          SECONDS_OF_DAY=$((10#$(date -u +%H) * 3600 + 10#$(date -u +%M) * 60 + 10#$(date -u +%S)))

          VERSION="${YEAR}.${MONTH}.${DAY}.${SECONDS_OF_DAY}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Setting package.json version to $VERSION"

          jq --arg version "$VERSION" \
            '.version = $version' package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun i

      - name: Build
        run: |
          bun run build
          rm -f dist/newchrome/.amo-upload-uuid

      - name: Release Firefox
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: |
          node_modules/.bin/web-ext sign \
            --api-key "$WEB_EXT_API_KEY" \
            --api-secret "$WEB_EXT_API_SECRET" \
            --source-dir dist/newchrome \
            --artifacts-dir dist/firefox \
            --channel=unlisted

      - name: Find XPI
        id: xpi
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mapfile -t files < <(
            find . -type f -name "*.xpi"
          )

          if [[ ${#files[@]} -ne 1 ]]; then
            echo "Expected exactly one XPI, found ${#files[@]}" >&2
            find . -type f -name '*.xpi' >&2
            exit 1
          fi
          mv $(realpath "${files[0]}") ./dist/firefox-dist.xpi

      - name: Get Release Metadata
        id: release
        shell: bash
        run: |
          echo "hash=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "subject=$(git log -1 --format=%s)" >> "$GITHUB_OUTPUT"
          echo "message<<EOF" >> "$GITHUB_OUTPUT"
          git log -1 --format=%B >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date -u "+%Y-%m-%d %H:%M:%S.%N %Z")" >> "$GITHUB_OUTPUT"
          echo "author=$(git log -1 --format='%an <%ae>')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and Upload Raw Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: commit-${{ steps.release.outputs.hash }}
          name: ${{ steps.release.outputs.subject }} - ${{ steps.release.outputs.hash }}
          body: |
            Commit: ${{ steps.release.outputs.subject }}

            Full commit: ${{ steps.release.outputs.hash }}
            Author: ${{ steps.release.outputs.author }}
            Created: ${{ steps.release.outputs.timestamp }}

            ## Commit Message
            ${{ steps.release.outputs.message }}
          files: |
            ./dist/firefox-dist.xpi
            ./dist/oldchrome-dist.zip
            ./dist/newchrome-dist.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
